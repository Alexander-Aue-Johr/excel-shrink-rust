[package]
name = "excel-lab-images"
version = "0.1.0"
edition = "2021"

# This tool is deliberately isolated; it does not change the shrink workspace.
[workspace]

[dependencies]
anyhow = "1"
image = { version = "=0.25.8", default-features = false, features = ["png", "bmp"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
