[workspace]
members = [
    "excel-shrink-core",
    "excel-shrink-cli",
    "apps/sheetshrink",
]
resolver = "2"

[profile.profiling]
inherits = "release"
debug = "full"

[workspace.dependencies]
thiserror = "1.0"
tracing = "0.1"
regex = "1.10"
rayon = "1.8"
bstr = "1.9"
derive-new = "0.6"
derive_builder = "0.20"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
