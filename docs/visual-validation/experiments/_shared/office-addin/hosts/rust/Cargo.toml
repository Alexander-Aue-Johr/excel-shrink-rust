[package]
name = "visual-validation-office-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
excel-com = {
    git = "https://github.com/Alexander-Aue-Johr/excel-api",
    branch = "fix-shape-variant-types"
}
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[workspace]
