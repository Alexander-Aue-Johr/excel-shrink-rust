<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{ASSET_PREFIX}}report-assets/observatory.css">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}report-assets/report.css">
</head>
<body class="report-body">
  <header class="report-header">
    <div>
      <p class="report-eyebrow">SheetScope · retained visual evidence</p>
      <h1 id="report-title">{{TITLE}}</h1>
    </div>
    <nav id="report-links" aria-label="Report files"></nav>
  </header>
  <main id="report-content">
    <noscript>Enable JavaScript to inspect the retained comparisons. The report JSON and images remain available in this folder.</noscript>
  </main>
  <script type="application/json" id="report-data">{{DATA}}</script>
  <script defer src="{{ASSET_PREFIX}}report-assets/report-view.js"></script>
</body>
</html>
