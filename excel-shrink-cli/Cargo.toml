[package]
name = "excel-shrink-cli"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "excel-shrink-cli"

[lib]
path = "src/main.rs"

[[bin]]
name = "excel-shrink-cli"
path = "src/excel_shrink_main.rs"

[[bin]]
name = "deltasieve"
path = "src/deltasieve_main.rs"

[features]
# Kept so older local commands that pass this feature still work; smoke corpus tests are default tests now.
corpus-regression-tests = []
cell-tracing = ["excel-shrink-core/cell-tracing"]

[dependencies]
deltasieve-engine = { path = "../crates/deltasieve-engine" }
excel-shrink-core = { path = "../excel-shrink-core" }
clap = { version = "4.4", features = ["derive"] }
tracing.workspace = true
rayon.workspace = true
threadpool = "1.8"
zip.workspace = true
anyhow = "1.0.102"
walkdir = "2.5.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
crc32fast = "1.5"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "sync", "time", "io-util", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Validation v9: cryptographic package/value digests.
[dependencies.sha2]
version = "0.10.9"
