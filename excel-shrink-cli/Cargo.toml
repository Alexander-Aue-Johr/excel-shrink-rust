[package]
name = "excel-shrink-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
excel-shrink-core = { path = "../excel-shrink-core" }
clap = { version = "4.4", features = ["derive"] }
tracing.workspace = true
rayon = "1.8"
threadpool = "1.8"
zip.workspace = true
anyhow = "1.0.102"
walkdir = "2.5.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }